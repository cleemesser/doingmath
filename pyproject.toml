[project]
name = "doingmath"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "altair>=6.2.2",
    "anywidget>=0.11.0",
    # autograd: reverse/forward-mode AD over a numpy drop-in. Used by
    # VectorCalculus/Div_Curl_and_the_Jacobian_autodiff.py, which recomputes that notebook's
    # numerics exactly instead of by finite differences. Pure Python, ~no install cost.
    "autograd>=1.9.1",
    "bokeh>=3.9.1",
    "clifford>=1.5.1",
    "eegml-neural-analysis[torch]",
    "einops>=0.8.2",
    "ipykernel>=7.3.0",
    "ipyvtklink>=0.2.3",
    "ipywidgets>=7.8.5",
    "jupyter>=1.1.1",
    "jupyterlab-myst>=2.7.0",
    "jupytext>=1.19.1",
    # jax + tensorly: VectorCalculus/Div_Curl_and_the_Jacobian_tensorly.py writes its vector
    # fields against tensorly's backend-agnostic `tl.*` and gets derivatives from whichever
    # framework is selected. tensorly abstracts arrays only -- it has no autodiff API -- so jax
    # is the default differentiable backend and is needed for that notebook to run at all.
    # The pytorch backend also works and is exercised in its Appendix B when the torch extra
    # is installed; Appendix B skips any backend it cannot import.
    "jax>=0.11",
    "tensorly>=0.9.0",
    "k3d>=2.17.0",
    "kingdon>=2.1.1",
    "kingdon-tensor",
    # marimo notebooks (GeometricLinearAlgebra/*_marimo.py) run in *this* environment
    # rather than a --sandbox venv, so that they can `import clmmathtools.viz as mv` and reuse
    # the same Plane/Space3D scenes as the paired jupytext notebooks.
    "marimo>=0.23.3",
    "clmmathtools",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "ogrepy>=2.0.0",
    "pandas>=3.0.3",
    "pillow>=11.0.0",
    "plotly>=6.9.0",
    "pylatexenc>=2.11",
    "pymupdf>=1.27.2.3",
    "pyvista-zstd>=0.2.4",
    "pyvista[all]>=0.48.4",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "sympy>=1.14.0",
    # Pinned to the vue2 stack: vedo 2026.6.1's trame backend builds its UI with
    # the vue2 vuetify widgets and calls trame.app.jupyter.show, both of which
    # were removed in the trame 3.x / vue3 line. trame 2.5.2 is what vedo expects.
    "sympy-plot-backends[all]>=4.2.0",
    "trame==2.5.2",
    "trame-vtk<2.6",
    "trame-vuetify<3",
    "vedo>=2026.6.1",
    "wigglystuff>=0.5.23",
    "xarray>=2026.4.0",
    "multimethod==1.10", # needs to be pinned back for scikit-fda to work
    "scikit-fda>=0.10.1",
    "pydantic-ai>=2.40.0",
]

[project.optional-dependencies]
# PyTorch is optional: nothing in the notebooks imports it unless you ask for
# it. `torch` is the one you normally want -- it picks the right build for the
# machine automatically. `cpu` and `cu129` are explicit overrides.
#
# On Apple silicon there is no separate "MPS wheel": the ordinary PyPI
# arm64 wheel is already built with the MPS backend, so on darwin the `torch`
# extra deliberately matches *no* [tool.uv.sources] entry and resolves from
# PyPI. The download.pytorch.org indexes only matter off macOS.
torch = ["torch>=2.13"]
cpu = ["torch>=2.13"]
cu129 = ["torch>=2.13"]

[dependency-groups]
dev = [
    "meson>=1.11.1",
    "pytest>=8.0",
]

[tool.uv]
conflicts = [[{ extra = "torch" }, { extra = "cpu" }, { extra = "cu129" }]]

[tool.uv.sources]
kingdon-tensor = { path = "kingdon_tensor", editable = true }
clmmathtools = { path = "clmmathtools", editable = true }
torch = [
    # `torch` extra: auto-dispatch. Off macOS take the CUDA build; on macOS
    # there is no matching entry, so it falls through to PyPI -> MPS wheel.
    { index = "pytorch-cu129", extra = "torch", marker = "sys_platform != 'darwin'" },
    # Explicit overrides, for when the auto choice is wrong.
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu129", extra = "cu129" },
]
eegml-neural-analysis = { workspace = true, editable = true }


# `explicit = true` keeps these indexes from being consulted for anything other
# than the packages that name them in [tool.uv.sources] above.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.workspace]
members = [
    "ext/neural_signal_analysis_notes",
]

[tool.pytest.ini_options]
testpaths = ["kingdon_tensor/tests", "clmmathtools/tests"]
addopts = "-q"

