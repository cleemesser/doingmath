[project]
name = "mathviz"
version = "0.1.0"
description = "Plane and complex-function visualization: linear maps, conformal maps, and Wegert phase portraits, over pluggable matplotlib/vedo backends."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.9",
    "vedo>=2026.6.1",
    "pillow>=11.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mathviz*"]
