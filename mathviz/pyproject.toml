[project]
name = "mathviz"
version = "0.1.0"
description = "Plane and complex-function visualization: linear maps, conformal maps, and Wegert phase portraits, over pluggable matplotlib/vedo backends."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.9",
    "vedo>=2026.6.1",
    "pillow>=11.0.0",
]

[project.optional-dependencies]
# animate.py imports these lazily: ipywidgets only in scrubber(), scipy only in the
# expm/logm-based geodesic_path(). GIF export needs neither (pillow is already core).
interactive = [
    "ipywidgets>=7.6",
    "scipy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mathviz*"]
